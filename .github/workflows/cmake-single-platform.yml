name: CMake (Linux, GCC14)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Debug
  PRESET: host-default

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc14]

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14
        if: matrix.compiler == 'gcc14'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 wget
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-format-22

      # --- Set CC/CXX for subsequent steps ---
      - name: Select compiler
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: Show compiler versions
        run: |
          echo "Using CC=$CC, CXX=$CXX"
          $CC --version
          $CXX --version
          clang-format-22 --version

      - name: Select clang-format
        run: echo "PATH=/usr/lib/llvm-22/bin:$PATH" >> $GITHUB_ENV

      # --- Configure ---
      - name: Configure CMake (Preset)
        run: |
          cmake --preset ${{ env.PRESET }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX"

      # --- Build ---
      - name: Build
        run: cmake --build --preset ${{ env.PRESET }} --parallel

      - name: Check clang-format
        run: cmake --build --preset ${{ env.PRESET }} --target clang_format_check

      # --- Test ---
      - name: Run tests
        run: ctest --test-dir out/build/host-default/tests --output-on-failure -C ${{ env.BUILD_TYPE }}
